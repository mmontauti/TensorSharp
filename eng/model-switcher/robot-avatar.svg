<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Robot">
  <!-- Assistant avatar used by the model presets (assistant-avatar option).
       Transparent background: the web UI draws the avatar's rounded tile itself. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#a9b6e6"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0d1124"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#37c8f0"/>
    </radialGradient>
  </defs>

  <!-- antenna -->
  <rect x="61" y="14" width="6" height="18" rx="3" fill="#8d9bd0"/>
  <circle cx="64" cy="13" r="8" fill="url(#glow)"/>

  <!-- ears -->
  <rect x="10" y="56" width="14" height="30" rx="6" fill="#8d9bd0"/>
  <rect x="104" y="56" width="14" height="30" rx="6" fill="#8d9bd0"/>

  <!-- head -->
  <rect x="20" y="30" width="88" height="82" rx="24" fill="url(#shell)"/>
  <rect x="20" y="30" width="88" height="82" rx="24" fill="none" stroke="#6c8cff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- visor -->
  <rect x="31" y="46" width="66" height="44" rx="16" fill="url(#visor)"/>

  <!-- eyes -->
  <circle cx="50" cy="64" r="8" fill="url(#glow)"/>
  <circle cx="78" cy="64" r="8" fill="url(#glow)"/>

  <!-- smile -->
  <path d="M52 78 Q64 86 76 78" fill="none" stroke="#8ff3ff" stroke-width="4" stroke-linecap="round"/>

  <!-- cheek lights -->
  <circle cx="34" cy="100" r="3" fill="#6c8cff"/>
  <circle cx="94" cy="100" r="3" fill="#6c8cff"/>
</svg>
